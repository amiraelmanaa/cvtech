<h3>Mini Word</h3>

    <p [ngStyle]="{ color: color, 
    'font-size.px': size,
    'font-family': font
     }">
      Test : modifiez la couleur, la taille et la police.
    </p>

    <div class="row g-3">
      <div class="col-md-4">
        <input
         type="color"
         class="form-control form-control-color w-100"
         [(ngModel)]="color" />
      </div>
      <div class="col-md-4">
        <input
         type="number"
         class="form-control"
          min="8" max="100" 
          [(ngModel)]="size" />
      </div>
      
      <div class="col-md-4">
        <select class="form-select" [(ngModel)]="font">
          @for (f of fonts; track f) {
            <option [value]="f">{{ f }}</option>
          }
        </select>
      </div>
    </div>
