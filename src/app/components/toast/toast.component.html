<div class="toast-container position-fixed top-0 end-0 p-3">
      @for (t of toastService.toasts(); track t.id) {
        <div class="toast show align-items-center border-0 mb-2" [class]="'text-bg-' + t.type">
          <div class="d-flex">
            <div class="toast-body">{{ t.message }}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastService.remove(t.id)"></button>
          </div>
        </div>
      }
    </div>
